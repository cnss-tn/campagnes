<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/cnss_logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/interface1.css" />
    <link rel="stylesheet" href="css/my-account.css" />
  </head>
  <body class="page-programme page-account">
    <div class="composed-backdrop" aria-hidden="true"></div>
    <div class="composed-grid-pattern" aria-hidden="true"></div>

    <header class="composed-topbar">
      <nav class="navbar composed-nav py-2" dir="rtl">
        <div class="container composed-nav-inner">
          <div class="composed-brand">
            <img src="images/cnss_logo.svg" alt="" class="composed-brand-logo" width="44" height="44" decoding="async" />
            <div class="brand-mini-menu" aria-label="Menu">
              <a href="main-page.html" class="btn btn-outline-secondary btn-sm composed-menu-btn" id="nav-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
              </a>
              <a href="interface1.html" class="btn btn-outline-secondary btn-sm composed-menu-btn">البرنامج</a>
              <a href="interface2.html" class="btn btn-outline-secondary btn-sm composed-menu-btn">الإحصائيات</a>
              <a href="users_management.html" class="btn btn-outline-secondary btn-sm composed-menu-btn" id="nav-users" style="display:none">إدارة المستخدمين</a>
            </div>
          </div>
          <div class="composed-user-panel">
            <div class="composed-user-lines">
              <div id="user-info" class="composed-user-line">--</div>
            </div>
            <a href="my-account.html" class="btn btn-outline-secondary btn-sm composed-menu-btn is-active" id="btn-account" aria-current="page">حساب المستعمل</a>
            <button type="button" class="btn btn-outline-secondary btn-sm composed-menu-btn p-0" id="btn-logout"><img src="images/off_icon.svg" alt="خروج" width="32" height="32" /></button>
          </div>
        </div>
      </nav>
    </header>

    <main class="container composed-main" dir="rtl">
      <div class="row g-4 justify-content-center">
        <div class="col-lg-10 mt-0">
          <div class="card card-composed account-card">
            <div class="card-composed-accent" aria-hidden="true"></div>
            <div class="card-composed-body p-4 p-lg-4">
              <div class="account-title text-center mb-4">
                <h1 class="h4 fw-bold mb-1 acc-name">حساب المستعمل</h1>
              </div>

              <div class="account-split">
                <section class="account-panel">
                  <div class="account-panel-title">المعلومات الشخصية</div>
                  <div class="account-info-grid">
                    <div class="account-info-item">
                      <div class="account-info-label">الاسم و اللقب</div>
                      <div class="account-info-value acc-name">--</div>
                    </div>
                    <div class="account-info-item">
                      <div class="account-info-label">الرقم الآلي</div>
                      <div class="account-info-value" id="acc-matricule">--</div>
                    </div>
                    <div class="account-info-item">
                      <div class="account-info-label">الوظيفة</div>
                      <div class="account-info-value" id="acc-grade">--</div>
                    </div>
                    <div class="account-info-item pb-4">
                      <div class="account-info-label">المكتب</div>
                      <div class="account-info-value" id="acc-bureau">--</div>
                    </div>
                  </div>
                </section>

                <div class="vr account-divider" aria-hidden="true"></div>

                <section class="account-panel">
                  <div class="account-panel-title">تغيير كلمة المرور</div>
                  <div class="alert d-none" id="account-alert" role="alert"></div>

                  <form id="form-change-password" novalidate>
                    <div id="change-password-panel">
                      <div class="mb-3">
                        <label class="form-label" for="old-pw">كلمة المرور القديمة</label>
                        <input type="password" class="form-control" id="old-pw" autocomplete="current-password" required />
                      </div>
                      <div class="mb-3">
                        <label class="form-label" for="new-pw">كلمة المرور الجديدة</label>
                        <input type="password" class="form-control" id="new-pw" autocomplete="new-password" required />
                      </div>
                      <div class="mb-3">
                        <label class="form-label" for="new-pw-2">تأكيد كلمة المرور الجديدة</label>
                        <input type="password" class="form-control" id="new-pw-2" autocomplete="new-password" required />
                      </div>
                      <div class="d-flex justify-content-center mt-3">
                        <button type="submit" class="btn btn-primary" id="btn-change-password">تغيير كلمة المرور</button>
                      </div>
                    </div>

                    <div class="change-password-loader d-none" id="change-password-loader" aria-live="polite">
                      <div class="spinner-border text-success" role="status" aria-label="Chargement">
                        <span class="visually-hidden">تحديث</span>
                      </div>
                      <div class="small text-muted fw-semibold mt-3">تحديث...</div>
                    </div>
                  </form>
                </section>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/api_1.js"></script>
    <script src="js/my-account.js"></script>
    <script>
    (function() {
        var user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        var is_admin = (user.userType || '').trim().toLowerCase() === 'admin';
        if (is_admin) document.body.classList.add('page-admin');
        var navUsers = document.getElementById('nav-users');
        if (navUsers) navUsers.style.display = is_admin ? '' : 'none';
        var links = document.querySelectorAll('.brand-mini-menu .composed-menu-btn:not(#nav-home)');
        var page = window.location.pathname.split('/').pop() || '';
        for (var i = 0; i < links.length; i++) {
            var t = links[i].textContent.trim();
            if (t === 'البرامج' || t === 'البرنامج') {
                links[i].href = is_admin ? 'interface3.html' : 'interface1.html';
            } else if (t === 'الإحصائيات') {
                links[i].href = is_admin ? 'interface4.html' : 'interface2.html';
            } else if (t === 'إدارة المستخدمين') {
                links[i].href = 'users_management.html';
            }
            links[i].classList.remove('is-active');
            if (links[i].getAttribute('href') === page) {
                links[i].classList.add('is-active');
            }
        }
    })();
    </script>
    <div class="on-user"><span class="dot"></span><span id="on-user-text">...</span></div>
    <div class="dev-credit">تصميم وتطوير: إدارة المراقبة - أحمد الزكراوي</div>
  </body>
</html>
