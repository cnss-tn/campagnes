    <script>
      try {
        // 4h session expiry (server-time based at login, checked here with client clock as fallback)
        var _cu = JSON.parse(localStorage.getItem("currentUser") || "null");
        if (_cu && _cu.token) {
          var _exp = Number(_cu.sessionExpiresAt);
          if (!Number.isFinite(_exp) || Date.now() >= _exp) {
            try { localStorage.removeItem("currentUser"); } catch (_e0) {}
            try { localStorage.removeItem("_pendingOTP"); } catch (_e1) {}
            window.location.href = "index.html";
          }
        }
        var u = JSON.parse(localStorage.getItem("currentUser"));
        if (!u || !u.token) {
          window.location.href = "index.html";
        } else {
          var _isAdmin = String(u.userType || "").trim().toLowerCase() === "admin";
          var _pwc = u.pw_changed; if (_pwc == null && u.pwChanged != null) _pwc = u.pwChanged; if (_pwc == null) _pwc = _isAdmin ? 1 : 0;
          if (!_isAdmin && Number(_pwc) === 0) {
            window.location.href = "pw-force-change.html";
          } else if ((u.userType || "").trim().toLowerCase() !== "admin") {
            window.location.href = "main-page.html";
          }
        }
      } catch (e) {
        window.location.href = "index.html";
      }
    </script>

            <div class="card-composed-body p-4 p-lg-4 d-flex flex-column">

              <!-- Filters -->

                      </div>
                      <div class="results-filter-compact results-filter-compact--type">

    <!-- Modal form user (popup centered) -->
    <div class="modal fade" id="modal-user-form" tabindex="-1" aria-labelledby="modal-user-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content stats-modal-content" dir="rtl">
          <div class="modal-header border-0 py-3 px-4">
            <h5 class="modal-title fw-bold" id="modal-user-title">مستخدم جديد</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
          </div>
          <div class="modal-body pt-0 px-4 pb-4">
            <form id="form-user" novalidate>
              <div class="form-row-2 mb-3">
                <div>
                  <label class="form-label" for="user-matricule">المعرف (Matricule) *</label>
                  <input type="number" id="user-matricule" class="form-control" placeholder="مثال: 126359" required min="1" />
                </div>
                <div>
                  <label class="form-label" for="user-grade">الرتبة *</label>
                  <select id="user-grade" class="form-select" required>
                    <option value="">اختر...</option>
                    <option value="CT">CT</option>
                    <option value="CU">CU</option>
                    <option value="CC">CC</option>
                    <option value="DRC">DRC</option>
                    <option value="CONTROLLEUR">CONTROLLEUR</option>
                  </select>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="user-ar-name">الاسم بالعربية *</label>
                <input type="text" id="user-ar-name" class="form-control" placeholder="الاسم الكامل" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="user-fr-name">الاسم بالفرنسية *</label>
                <input type="text" id="user-fr-name" class="form-control" placeholder="Nom complet" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="user-code-br">المكتب (Code Bureau) *</label>
                <select id="user-code-br" class="form-select" required>
                  <option value="">تحميل...</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="user-type">نوع المستعمل *</label>
                <select id="user-type" class="form-select" required>
                  <option value="normal">normal</option>
                  <option value="admin">admin</option>
                  <option value="visionnaire">visionnaire</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="user-email">البريد الإلكتروني</label>
                <input type="email" id="user-email" class="form-control" placeholder="exemple@domaine.tn" dir="ltr" style="text-align:left;" autocomplete="email" />
                <div class="form-text" style="font-size:0.70rem">يُستخدم لإرسال رمز التحقق — اتركه فارغاً إذا غير معروف</div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="user-pw">كلمة المرور <span id="pw-hint" class="text-muted" style="font-weight:400;font-size:0.72rem">(مطلوبة للإضافة)</span></label>
                <input type="password" id="user-pw" class="form-control" placeholder="••••••••" autocomplete="new-password" />
              </div>
              <button type="submit" class="btn btn-primary w-100" id="btn-submit">
                <span id="btn-text">إضافة المستعمل</span>
                <span class="spinner-border spinner-border-sm ms-2 d-none" id="btn-submit-spinner" role="status" aria-hidden="true"></span>
              </button>
            </form>
          </div>
        </div>
