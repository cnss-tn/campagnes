<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متصفح قديم</title>
    <link rel="icon" href="images/cnss_logo.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 1rem;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: #212529;
        background: #0f5132;
        background: linear-gradient(135deg, #0f5132 0%, #146c43 45%, #1e7e34 100%);
      }
      body:before {
        content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0;
        background-image: radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1px);
        background-size: 22px 22px;
        pointer-events: none;
      }
      .card {
        position: relative;
        max-width: 30rem; width: 100%; margin: 0;
        background: #ffffff; border-radius: 20px;
        padding: 0 0 1.3rem; overflow: hidden;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      }
      .card-top {
        background: linear-gradient(135deg, #f59e0b, #f97316);
        padding: 1.3rem 1.4rem 1.1rem; text-align: center;
      }
      .logo-badge {
        display: inline-block; background: #fff; border-radius: 50%;
        width: 64px; height: 64px; line-height: 64px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        margin-bottom: 0.5rem;
      }
      .logo-badge img { vertical-align: middle; }
      h1 { font-size: 1.15rem; margin: 0; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
      .card-body { padding: 1.1rem 1.4rem 0; }
      ol { margin: 0 0 1rem; padding: 0; list-style: none; counter-reset: step; }
      ol li {
        counter-increment: step;
        position: relative;
        font-size: 0.87rem; line-height: 1.6;
        background: #f8faf9;
        border: 1px solid #e3efe8; border-radius: 12px;
        padding: 0.55rem 2.6rem 0.55rem 0.8rem;
        margin-bottom: 0.5rem;
      }
      ol li:before {
        content: counter(step);
        position: absolute; top: 50%; right: 0.7rem;
        width: 1.5rem; height: 1.5rem; line-height: 1.5rem; margin-top: -0.75rem;
        text-align: center; font-size: 0.78rem; font-weight: 700;
        color: #fff; background: linear-gradient(135deg, #0f5132, #1e7e34);
        border-radius: 50%;
      }
      .link-label { font-size: 0.83rem; font-weight: 700; color: #0f5132; margin: 0 0 0.35rem; }
      .link-row { display: flex; gap: 0.4rem; }
      .link-row input {
        flex: 1; min-width: 0; direction: ltr; text-align: left;
        font-size: 0.78rem; padding: 0.5rem 0.6rem;
        border: 1.5px solid #ced4da; border-radius: 10px; background: #f8f9fa; color: #212529;
      }
      .link-row input:focus { outline: none; border-color: #f59e0b; }
      .link-row button {
        flex-shrink: 0; font-size: 0.82rem; font-weight: 700;
        padding: 0.5rem 1.1rem; border-radius: 10px; cursor: pointer;
        color: #fff; border: none;
        background: linear-gradient(135deg, #f59e0b, #f97316);
        box-shadow: 0 4px 12px rgba(249,115,22,0.4);
      }
      .link-row button:hover { filter: brightness(1.07); }
      .link-row button:active { transform: translateY(1px); }
      .copied { font-size: 0.76rem; font-weight: 700; color: #0f5132; margin: 0.3rem 0 0; min-height: 1.1em; text-align: center; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-top">
        <span class="logo-badge"><img src="images/cnss_logo.svg" width="38" height="38" alt="" /></span>
        <h1>متصفحك قديم ولا يدعم هذا التطبيق</h1>
      </div>
      <div class="card-body">
        <ol>
          <li>افتح Edge أو Firefox إن كانا متوفرين بنسخة حديثة.</li>
          <li>أو حدّث متصفحك الحالي إلى آخر نسخة.</li>
          <li>إذا تعذر الحل، اتصل بمسؤول الإعلامية.</li>
        </ol>
        <p class="link-label">رابط التطبيق لفتحه في المتصفح الحديث :</p>
        <div class="link-row">
          <input type="text" id="app-link" readonly value="https://cnss-tn.github.io/campagnes" />
          <button type="button" id="btn-copy-link">نسخ</button>
        </div>
        <p class="copied" id="copy-msg"></p>
      </div>
    </div>
    <script>
    (function () {
        var btn = document.getElementById('btn-copy-link');
        var input = document.getElementById('app-link');
        var msg = document.getElementById('copy-msg');
        if (!btn || !input) return;
        btn.onclick = function () {
            try {
                input.focus();
                input.select();
                input.setSelectionRange(0, input.value.length);
                var done = false;
                try { done = document.execCommand('copy'); } catch (e) { done = false; }
                if (msg) msg.textContent = done ? 'تم النسخ بنجاح' : '';
            } catch (e) {}
            try { if (window.getSelection) window.getSelection().removeAllRanges(); } catch (e) {}
        };
    })();
    </script>
  </body>
</html>
