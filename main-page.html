    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/main-page.css" />
    <script src="js/api_1.js"></script>
    <script>
      try {
        // 4h session expiry (server-time based at login, checked here with client clock as fallback)
        var _cu = JSON.parse(localStorage.getItem("currentUser") || "null");
        if (_cu && _cu.token) {
          var _exp = Number(_cu.sessionExpiresAt);
          if (!Number.isFinite(_exp) || Date.now() >= _exp) {
            try { localStorage.removeItem("currentUser"); } catch (_e0) {}
            try { localStorage.removeItem("_pendingOTP"); } catch (_e1) {}
            window.location.href = "index.html";
          }
        }
        var u = JSON.parse(localStorage.getItem("currentUser"));
        if (!u || !u.token) {
          window.location.href = "index.html";
        } else if ((u.userType || "").trim().toLowerCase() === "admin") {
          window.location.href = "admin-main-page.html";
        } else {
          var _pwc = u.pw_changed; if (_pwc == null && u.pwChanged != null) _pwc = u.pwChanged;
          if (_pwc == null) _pwc = 0;
          if (Number(_pwc) === 0) window.location.href = "pw-force-change.html";
        }
      } catch (e) {
        window.location.href = "index.html";
      }
    </script>
  </head>

      </div>

      <a href="my-account.html" class="btn btn-outline-secondary btn-sm composed-menu-btn" id="btn-account">حساب المستعمل</a>

    </div>

    <div class="page-main-inner">

        <img src="images/cnss_logo.svg" alt="" class="main-logo" width="56" height="56" />

      <div class="main-cards">

          <div class="main-card__icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

              <line x1="12" y1="20" x2="12" y2="4" />
              <line x1="6" y1="20" x2="6" y2="14" />
            </svg>
          </div>
          <h2 class="main-card__title">إحصائيات الحملات</h2>
          <span class="main-card__arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
        </a>
        <a href="interface1.html" class="main-card main-card--programme">
          <div class="main-card__glow"></div>
          <div class="main-card__icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
          </div>
          <h2 class="main-card__title">برنامج الحملات</h2>
          <span class="main-card__arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
        </a>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        let user = null;
        try {
          user = JSON.parse(localStorage.getItem("currentUser"));
        } catch {}
        if (!user || !user.token) {
          try {
            localStorage.setItem("postLoginRedirect", "main-page.html");
          } catch {}
          window.location.href = "index.html";
          return;
        }
        if ((user.userType || "").trim().toLowerCase() === "admin") {
          window.location.href = "admin-main-page.html";
          return;
        }
        var _pwcMain = user.pw_changed; if (_pwcMain == null && user.pwChanged != null) _pwcMain = user.pwChanged;
        if (_pwcMain == null) _pwcMain = 0;
        if (Number(_pwcMain) === 0) { window.location.href = 'pw-force-change.html'; return; }
        if (typeof window !== "undefined" && typeof window.isSessionExpired === "function" && window.isSessionExpired()) {
          if (typeof window.logoutToLogin === "function") window.logoutToLogin();
          else window.location.href = "index.html";
          return;
        }
        const greeting = document.getElementById("user-greeting");
        if (greeting) {
          const name = user.bureauNameAr || user.bureauName || user.arName || user.name || "";
          greeting.textContent = name ? ` ${name}` : "";
        }

        document.getElementById("btn-logout")?.addEventListener("click", () => {
          if (typeof window.logoutToLogin === "function") window.logoutToLogin();
          else window.location.href = "index.html";
        });
      });
    </script>
    <div class="on-user"><span class="dot"></span><span id="on-user-text">...</span></div>
    <div class="dev-credit">تصميم وتطوير: إدارة المراقبة - أحمد الزكراوي</div>
  </body>
</html>
